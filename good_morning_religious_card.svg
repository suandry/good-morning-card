<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4E1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="churchGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5DEB3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2B48C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="320" height="320" fill="url(#skyGradient)"/>
  
  <!-- 太阳 -->
  <circle cx="260" cy="50" r="35" fill="#FFD700" opacity="0.9"/>
  
  <!-- 教堂建筑 - 左侧 -->
  <g id="church-left">
    <!-- 教堂主体 -->
    <rect x="30" y="140" width="100" height="120" fill="url(#churchGradient)" stroke="#8B7355" stroke-width="2"/>
    
    <!-- 教堂屋顶 -->
    <polygon points="50,140 80,80 110,140" fill="#8B4513" stroke="#654321" stroke-width="2"/>
    
    <!-- 十字架 -->
    <line x1="80" y1="75" x2="80" y2="95" stroke="#FFD700" stroke-width="3"/>
    <line x1="70" y1="85" x2="90" y2="85" stroke="#FFD700" stroke-width="3"/>
    
    <!-- 门 -->
    <rect x="60" y="220" width="40" height="40" fill="#654321" stroke="#000" stroke-width="1"/>
    <circle cx="95" cy="240" r="3" fill="#FFD700"/>
    
    <!-- 窗户 -->
    <rect x="45" y="160" width="20" height="20" fill="#87CEEB" stroke="#000" stroke-width="1"/>
    <rect x="75" y="160" width="20" height="20" fill="#87CEEB" stroke="#000" stroke-width="1"/>
    <line x1="55" y1="160" x2="55" y2="180" stroke="#000" stroke-width="0.5"/>
    <line x1="45" y1="170" x2="65" y2="170" stroke="#000" stroke-width="0.5"/>
    <line x1="85" y1="160" x2="85" y2="180" stroke="#000" stroke-width="0.5"/>
    <line x1="75" y1="170" x2="95" y2="170" stroke="#000" stroke-width="0.5"/>
  </g>
  
  <!-- 教堂建筑 - 右侧 -->
  <g id="church-right">
    <!-- 教堂主体 -->
    <rect x="190" y="150" width="90" height="110" fill="url(#churchGradient)" stroke="#8B7355" stroke-width="2"/>
    
    <!-- 钟塔 -->
    <rect x="215" y="100" width="40" height="50" fill="#D2B48C" stroke="#8B7355" stroke-width="2"/>
    <polygon points="220,100 225,80 230,85 235,80 240,100" fill="#8B4513" stroke="#654321" stroke-width="1.5"/>
    
    <!-- 钟 -->
    <circle cx="235" cy="120" r="8" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
    
    <!-- 门 -->
    <rect x="210" y="220" width="50" height="40" fill="#654321" stroke="#000" stroke-width="1"/>
    <circle cx="250" cy="240" r="3" fill="#FFD700"/>
    
    <!-- 窗户 -->
    <rect x="205" y="165" width="18" height="18" fill="#87CEEB" stroke="#000" stroke-width="1"/>
    <rect x="235" y="165" width="18" height="18" fill="#87CEEB" stroke="#000" stroke-width="1"/>
    <line x1="214" y1="165" x2="214" y2="183" stroke="#000" stroke-width="0.5"/>
    <line x1="205" y1="174" x2="223" y2="174" stroke="#000" stroke-width="0.5"/>
  </g>
  
  <!-- 云朵 -->
  <g opacity="0.7">
    <ellipse cx="40" cy="40" rx="30" ry="20" fill="#FFF"/>
    <ellipse cx="20" cy="45" rx="22" ry="16" fill="#FFF"/>
    <ellipse cx="60" cy="45" rx="25" ry="17" fill="#FFF"/>
  </g>
  
  <g opacity="0.7">
    <ellipse cx="270" cy="120" rx="28" ry="19" fill="#FFF"/>
    <ellipse cx="250" cy="125" rx="20" ry="15" fill="#FFF"/>
    <ellipse cx="290" cy="125" rx="24" ry="16" fill="#FFF"/>
  </g>
  
  <!-- 顶部文本 -->
  <text x="160" y="30" font-family="SimHei, 黑体, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#8B0000">诗篇 100:4 - 当称谢进入他的门</text>
  
  <!-- 主要祝福文本 -->
  <text x="160" y="280" font-family="SimHei, 黑体, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#DC143C">早上好！</text>
  
  <!-- 左下祝福 -->
  <text x="60" y="300" font-family="SimHei, 黑体, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1E90FF">主日快乐！</text>
  
  <!-- 右下祝福 -->
  <text x="240" y="300" font-family="SimHei, 黑体, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1E90FF">愿主祝福你</text>
  
  <!-- 底部祝福 -->
  <text x="160" y="318" font-family="SimHei, 黑体, sans-serif" font-size="14" text-anchor="middle" fill="#4169E1">耶稣爱你 🙏</text>
</svg>